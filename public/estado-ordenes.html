<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Estado mensual de órdenes</title><link rel="stylesheet" href="/order-portal.css"></head><body><header><div><strong>Estado de órdenes de producción</strong><small>Consulta mensual · Solo lectura</small></div></header><main><h1>Seguimiento de órdenes</h1><p>El historial se conserva por mes de programación y se actualiza cuando cambia el estado de una orden.</p><section id="status-login" class="panel"><form id="status-login-form"><h2>Iniciar sesión</h2><p class="hint">Ingresa las credenciales de consulta para ver las órdenes.</p><label>Usuario<input id="status-username" name="username" autocomplete="username" maxlength="100" required></label><label style="margin-top:16px">Contraseña<input id="status-password" name="password" type="password" autocomplete="current-password" maxlength="128" required></label><p id="status-login-error" class="error" role="alert" hidden></p><button class="primary" type="submit" style="margin-top:20px">Entrar a la consulta</button></form></section><section id="status-content" hidden><div class="queue-controls"><label>Mes<select id="status-month"></select></label><button id="refresh-status">Actualizar</button><button id="print-status">Imprimir / guardar PDF</button><button id="logout-status">Cerrar sesión</button></div><p id="status-error" class="error" role="alert" hidden></p><p id="status-summary" role="status"></p><div id="status-orders"></div><small id="status-updated"></small></section></main><style>@media print{button,header{display:none!important}.order-card{break-inside:avoid}main{padding:0}.panel{border:0}}</style><script type="module" src="/order-status.js"></script></body></html>
